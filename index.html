<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>Yu-Gi-Oh! LP Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="authors" content="Soulsbros" />
  </head>
  <body>
    <main id="setup" class="screen" hidden>
      <h1>Yu-Gi-Oh! LP Tracker</h1>
      <form id="setup-form">
        <div class="field">
          <span class="label">Players</span>
          <div class="stepper">
            <button type="button" id="count-dec" aria-label="Fewer players">
              −
            </button>
            <output id="count" aria-live="polite"></output>
            <button type="button" id="count-inc" aria-label="More players">
              +
            </button>
          </div>
        </div>

        <label class="field">
          <span class="label">Starting LP</span>
          <input
            type="number"
            id="start-lp"
            inputmode="numeric"
            min="1"
            max="999999"
            step="1"
            required
          />
        </label>

        <div class="field">
          <span class="label">Names</span>
          <div id="names" class="names"></div>
        </div>

        <button type="submit" class="primary">Start Duel</button>
      </form>
    </main>

    <main id="duel" class="screen" hidden>
      <header class="topbar">
        <button type="button" id="to-setup">Setup</button>
        <button type="button" id="reset">Reset LP</button>
      </header>
      <div id="players" class="players"></div>
      <section class="tools">
        <div class="tool">
          <button type="button" id="coin" class="coin" aria-label="Toss a coin">
            ?
          </button>
          <p id="coin-result" class="tool-result" aria-live="polite">
            Tap to toss a coin
          </p>
        </div>
        <div class="tool">
          <button type="button" id="die" class="die" aria-label="Roll a die">
            ?
          </button>
          <p id="die-result" class="tool-result" aria-live="polite">
            Tap to roll a die
          </p>
        </div>
      </section>
    </main>

    <dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button value="cancel" autofocus>Cancel</button>
          <button value="ok" id="confirm-ok" class="primary"></button>
        </div>
      </form>
    </dialog>

    <template id="player-tpl">
      <section class="player">
        <div class="player-head">
          <h2 class="name"></h2>
          <span class="status">Defeated</span>
          <div class="quick">
            <button
              type="button"
              data-amount="500"
              aria-label="Subtract 500 LP"
            >
              −500
            </button>
            <button
              type="button"
              data-amount="1000"
              aria-label="Subtract 1000 LP"
            >
              −1000
            </button>
            <button
              type="button"
              data-amount="2000"
              aria-label="Subtract 2000 LP"
            >
              −2000
            </button>
            <button type="button" class="half" aria-label="Halve LP">½</button>
          </div>
        </div>
        <div class="lp-row">
          <div class="lp"></div>
          <button
            type="button"
            class="forfeit"
            aria-label="Forfeit"
            title="Forfeit"
          >
            🏳️
          </button>
        </div>
        <div class="controls">
          <button type="button" class="minus" aria-label="Subtract">−</button>
          <input
            type="number"
            class="amount"
            inputmode="numeric"
            min="1"
            step="1"
            placeholder="Amount"
            aria-label="Amount"
            enterkeyhint="done"
          />
          <button type="button" class="plus" aria-label="Add">+</button>
        </div>
      </section>
    </template>

    <footer>
      <p>
        &copy;2026
        <a href="https://soulsbros.ch" target="_blank" class="footer-link">
          Soulsbros
        </a>
      </p>
      <a
        href="https://github.com/Steeven9/Yu-Gi-Assistant"
        target="_blank"
        class="github-link"
      >
        <img src="githubLogo.webp" width="32" alt="GitHub logo" />
      </a>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
